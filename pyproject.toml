[project]
name = "napari-julich-surfer"
version = "0.1.0"
description = "A 3D brain surfer for the Julich-Brain atlas inside napari: pick parcels from a list and see them lit up in the navigator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "napari-julich-surfer contributors" }]
keywords = ["napari", "neuroimaging", "atlas", "julich", "brain", "surface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "napari>=0.5.0",
    "nilearn>=0.10.0",
    "nibabel>=5.0",
    "numpy>=1.24",
    "scikit-image>=0.21",
    "scipy>=1.10",
]

[project.optional-dependencies]
qt = ["PyQt6>=6.5"]
dev = ["pytest>=7.4", "pytest-qt>=4.2"]
macos = ["pyinstaller>=6.11", "pillow>=10"]
windows = ["pyinstaller>=6.11", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/example/napari-julich-surfer"

[project.entry-points."napari.manifest"]
napari-julich-surfer = "napari_julich_surfer:napari.yaml"

[project.scripts]
julich-surfer = "napari_julich_surfer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napari_julich_surfer"]

[tool.hatch.build.targets.sdist]
include = ["src/napari_julich_surfer", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
